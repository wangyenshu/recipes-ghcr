name: Version Ticker Bot

on:
  workflow_dispatch:
  schedule:
  - cron: '0 0 * * *'


jobs:

  update_versions:
    strategy:
      matrix:
        branch: [main]  # this repo has no emscripten-6x branch

    if: (github.event_name == 'schedule' && github.repository == 'wangyenshu/recipes-ghcr') || (github.event_name != 'schedule')
    runs-on: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          # push bump branches with the bot token, not the read-only GITHUB_TOKEN
          token: ${{ secrets.BOT_ACCESS_TOKEN }}

      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ci_env.yml

      - name: Determine new package version and open/merge PRs
        shell: bash -l -eo pipefail {0}
        run:  python -m emci bot bump-recipes-versions ${{ matrix.branch }}
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_ACCESS_TOKEN }}
