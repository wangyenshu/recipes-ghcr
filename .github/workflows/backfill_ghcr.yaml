
name: Backfill GHCR

on:
  workflow_dispatch:
    inputs:
      subdir:
        description: Conda platform
        required: true
        type: choice
        options:
          - emscripten-wasm32
          - linux-64
          - osx-arm64
          - noarch
      offset:
        type: number
        default: 0
      limit:
        type: number
        default: 50

permissions:
  contents: read
  packages: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: ghcr-backfill
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ci_env.yml
          init-shell: bash

      - uses: oras-project/setup-oras@v2

      - name: Login
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
            oras login ghcr.io \
              -u "${{ github.actor }}" \
              --password-stdin

      - name: Download and publish packages
        shell: bash -el {0}
        env:
          SUBDIR: ${{ inputs.subdir }}
          OFFSET: ${{ inputs.offset }}
          LIMIT: ${{ inputs.limit }}
        run: |
          python - <<'PY'
          import os
          import json
          import hashlib
          from pathlib import Path
          from urllib.request import urlopen, urlretrieve
          from urllib.parse import quote

          subdir = os.environ["SUBDIR"]
          offset = int(os.environ["OFFSET"])
          limit = int(os.environ["LIMIT"])
          if offset < 0 or limit < 1 or limit > 100:
              raise ValueError("Use offset >= 0 and 1 <= limit <= 100")

          base = "https://repo.prefix.dev/emscripten-forge-4x"
          with urlopen(f"{base}/{subdir}/repodata.json") as response:
              repodata = json.load(response)

          packages = repodata.get("packages", {})
          names = sorted(
              name for name in packages
              if name.endswith(".tar.bz2")
          )

          selected = names[offset:offset + limit]
          output = Path("output") / subdir
          output.mkdir(parents=True, exist_ok=True)

          for name in selected:
              target = output / name
              urlretrieve(f"{base}/{subdir}/{quote(name)}", target)
              expected = packages[name].get("sha256")
              if expected:
                  actual = hashlib.sha256(target.read_bytes()).hexdigest()
                  if actual != expected:
                      raise ValueError(f"SHA256 mismatch: {name}")
              print(f"Downloaded {name}")

          print(f"Total: {len(names)}; batch: {len(selected)}")
          print(f"Next offset: {offset + len(selected)}")
          PY

          python -m emci upload ghcr output \
            --platform "$SUBDIR" \
            --registry ghcr.io/wangyenshu \
            --source-url \
              https://github.com/wangyenshu/recipes-ghcr
