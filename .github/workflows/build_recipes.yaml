name: Build Recipes

on:
  push:
    branches:
      - "main"
    paths:
      - "recipes/**"
  pull_request:
    paths:
      - "recipes/**"

permissions:
  contents: read
  id-token: write      # signing the provenance attestations
  attestations: write  # storing them on GitHub
  packages: write      # pushing to ghcr.io with GITHUB_TOKEN

jobs:

  build_recipes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      FORCE_COLOR: 1
      TARGET_PLATFORM: emscripten-wasm32
      GITHUB_OWNER: "emscripten-forge"

    steps:
      ################################################################
      # SETUP
      ################################################################
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      ################################################################
      # CONFIG
      ################################################################
      - name: Global config
        shell: bash -el {0}
        run: git config --global advice.detachedHead false

      ################################################################
      # MAMBA
      ################################################################
      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ci_env.yml
          init-shell: bash
          cache-environment: false
          post-cleanup: "all"

      ################################################################
      # PLAYWRIGHT
      ################################################################
      - name: Detect playwright requirement
        id: playwright
        shell: bash -el {0}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            OLD=origin/main~1
            NEW=origin/main
          else
            OLD=origin/main
            NEW=HEAD
          fi
          needed=$(python -m emci build needs-playwright "$OLD" "$NEW")
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

      - name: Install playwright dependencies
        if: runner.os == 'Linux' && steps.playwright.outputs.needed == 'true'
        run: |
          sudo apt-get update -y && sudo apt-get install -y  \
          libwoff1  libvpx9  libevent-2.1-7t64 libopus0 libgstreamer-plugins-base1.0-0 \
          libgstreamer-gl1.0-0 \
          libgstreamer-plugins-bad1.0-0 \
          libflite1 \
          libavif16 \
          libharfbuzz-icu0 \
          libsecret-1-0 \
          libhyphen0 \
          libmanette-0.2-0 \
          libgles2 \
          gstreamer1.0-libav \
          libgtk-4-1 \
          libwayland-server0

      ################################################################
      # PUSH
      ################################################################
      - name: Build recipes with changes PUSH
        shell: bash -el {0}
        if: github.event_name == 'push'
        run: |
          python -m emci build changed $GITHUB_WORKSPACE/ origin/main~1 origin/main

      ################################################################
      # PULL_REQUEST
      ################################################################
      - name: Build recipes with changes PULL_REQUEST
        shell: bash -el {0}
        if: github.event_name == 'pull_request'
        run: |
          python -m emci build changed $GITHUB_WORKSPACE/ origin/main HEAD

      ################################################################
      # UPLOAD
      ################################################################
      - name: Create artifact
        uses: actions/upload-artifact@v7
        with:
          name: output
          path: output
        continue-on-error: true

      - name: Install oras
        if: (github.event_name == 'push' && github.repository == 'emscripten-forge/recipes')
        uses: oras-project/setup-oras@v2

      - name: Log in to ghcr.io
        if: (github.event_name == 'push' && github.repository == 'emscripten-forge/recipes')
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Upload packages to ghcr.io
        id: upload
        if: (github.event_name == 'push' && github.repository == 'emscripten-forge/recipes')
        shell: bash -el {0}
        run: |
          case "$(uname -s)" in
              Darwin)
                  # macOS: only upload osx-arm64
                  platforms=(osx-arm64)
                  ;;
              Linux)
                  # Linux: upload Linux artifacts
                  platforms=(emscripten-wasm32 linux-64 noarch)
                  ;;
              *)
                  echo "Unsupported OS: $(uname -s)"
                  exit 1
                  ;;
          esac
          args=()
          for platform in "${platforms[@]}"; do
            args+=(--platform "$platform")
          done

          # pushes each package to ghcr.io/<owner>/<channel>/<subdir>/<name>:<version>-<build>
          # and adds it to ghcr.io/<owner>/<channel>/<subdir>/repodata.json:latest
          python -m emci upload ghcr "${GITHUB_WORKSPACE}/output" "${args[@]}" \
            --registry "ghcr.io/${GITHUB_OWNER}" \
            --source-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

      # replaces `rattler-build upload prefix --generate-attestation`
      - name: Attest package provenance
        if: ${{ !cancelled() && steps.upload.outputs.pushed != '' }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.upload.outputs.pushed }}
