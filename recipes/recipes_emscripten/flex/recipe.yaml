context:
  name: flex
  version: 2.6.7

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/westes/flex/releases/download/v${{ version }}/flex-${{ version }}.tar.gz
  sha256: b8dbc5625462664d06ac028791e465ae23e0dc8a04e014890d366221d37d5008

build:
  number: 0

requirements:
  build:
  - autoconf
  - automake
  - libtool
  - make
  - ${{ compiler("c") }}
  - ${{ compiler('cxx') }}
  - pkg-config
  - autoconf-archive
  - gettext

tests:
- package_contents:
    files:
    - lib/libfl.a
    - include/FlexLexer.h

about:
  homepage: https://github.com/westes/flex
  license: LicenseRef-flex-BSD
  license_file: COPYING
  summary: The Fast Lexical Analyzer - scanner generator for lexing in C and C++

extra:
  recipe-maintainers:
  - wangyenshu
