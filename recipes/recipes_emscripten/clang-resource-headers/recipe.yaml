context:
  version: 23.1.5
  major_version: 23

package:
  name: clang-resource-headers
  version: ${{ version }}

source:
  url: https://github.com/llvm/llvm-project/archive/refs/tags/llvmorg-${{ version }}.tar.gz
  sha256: 70642a7e44e63c0ceff6624e5fd077b87766e4ed0bcd4a3ea8e3ffa3827ba538

build:
  number: 0
  noarch: generic

tests:
- package_contents:
    files:
    - lib/clang/${{ major_version }}/include/wasm_simd128.h

about:
  license: Apache-2.0 WITH LLVM-exception
  license_family: Apache
  license_file: LICENSE.TXT
  summary: Clang resource headers extracted from LLVM.
  homepage: https://llvm.org
extra:
  recipe-maintainers:
  - anutosh491
